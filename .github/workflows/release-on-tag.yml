name: Create release from tag

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to cut a release from (e.g. v1.3.103)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          tag="${{ github.event.inputs.tag }}"
          [ -n "$tag" ] || tag="${GITHUB_REF_NAME}"
          git rev-parse -q --verify "refs/tags/$tag" >/dev/null
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Create release if it does not exist
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          # The root holds exactly one build; attach it so the release is
          # self-contained. A second copy goes up under the fixed name
          # EquaSolve.html, which gives a permanent URL for scripts and links
          #   .../releases/latest/download/EquaSolve.html
          # at the cost of saving as a version-less filename. The README button
          # therefore points at the VERSIONED asset, so a download arrives named
          # for the build it is; the step below keeps that URL in step.
          build="$(git show --name-only --format= "refs/tags/$TAG" -- 'EquaSolve_V*.html' | head -n 1)"
          if [ -n "$build" ]; then
            git show "refs/tags/$TAG:$build" > "$build"
            cp "$build" EquaSolve.html
          else
            build=""
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            # Release already exists. Still make sure the fixed-name asset is on
            # it, so a run dispatched by hand can backfill an older release.
            if [ -n "$build" ]; then
              echo "Release $TAG exists; refreshing the fixed-name asset."
              gh release upload "$TAG" EquaSolve.html --clobber
            else
              echo "Release $TAG already exists and no build was found; nothing to do."
            fi
            exit 0
          fi

          gh release create "$TAG" \
            --title "EquaSolve $TAG" \
            --generate-notes \
            ${build:+"$build"} ${build:+EquaSolve.html}

      - name: Point the README download button at this build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          # The button names the build so the downloaded file is
          # EquaSolve_V1_3_NNN.html rather than a version-less EquaSolve.html.
          # A versioned URL has to change every release, and a release step that
          # depends on someone remembering is exactly what went wrong for
          # v1.3.101 through v1.3.103 -- so it is done here instead.
          build="$(git show --name-only --format= "refs/tags/$TAG" -- 'EquaSolve_V*.html' | head -n 1)"
          [ -n "$build" ] || { echo "No build in $TAG; leaving the README alone."; exit 0; }

          # Drop the working copies made above before moving off the tag.
          rm -f EquaSolve.html
          git checkout --quiet -- . 2>/dev/null || true
          git fetch --quiet origin main
          git checkout --quiet -B main origin/main

          ver="${TAG#v}"
          line="[![Download EquaSolve](https://img.shields.io/badge/%E2%AC%87%20Download%20EquaSolve-V${ver}-2ea44f?style=for-the-badge)](https://github.com/omabbasi/EquaSolve/releases/latest/download/${build})"
          awk -v repl="$line" '/^\[!\[Download EquaSolve\]/{print repl; next} {print}' README.md > README.tmp
          mv README.tmp README.md

          if git diff --quiet -- README.md; then
            echo "README button already points at $build."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit --quiet -m "Point the download button at $TAG"
          git push --quiet origin main
          echo "README button now points at $build."
